[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test/foundry"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200

# Handler-based invariant suite (test/foundry/QuantumVaultInvariant.t.sol).
# fail_on_revert = false: the handler deliberately attempts withdrawals that
# must revert (still-locked locks, already-withdrawn locks) and asserts the
# outcome itself, so reverts inside handler calls are expected, not failures.
[invariant]
runs = 256
depth = 100
fail_on_revert = false
